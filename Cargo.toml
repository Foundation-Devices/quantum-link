[workspace]
resolver = "2"
members = [
  "ql-codec",
  "ql-common",
  "ql-fsm",
  "ql-rpc",
  "ql-runtime",
  "ql-wire",
]

[workspace.package]
homepage = "https://github.com/Foundation-Devices/quantum-link"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bytes = "1"

# workspace crates
ql-common = { path = "ql-common" }
ql-fsm = { path = "ql-fsm" }
ql-rpc = { path = "ql-rpc" }
ql-wire = { path = "ql-wire" }
