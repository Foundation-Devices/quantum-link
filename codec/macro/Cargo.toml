[package]
name = "ql-codec-macro"
version = "0.1.0"
edition = "2021"
description = "QuantumLink codec derive"
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = { version = "2.0.106", default-features = false, features = [
  "derive",
  "parsing",
  "printing",
  "proc-macro",
] }

[dev-dependencies]
ql-codec = { workspace = true, features = ["derive"] }
